# Netlify: set "Base directory" to `frontend` in the site settings (or deploy
# from this folder). VITE_API_BASE below is baked in at build time, so
# redeploy after changing it.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Baked into the bundle at build time. Lives here (not only in the Netlify
  # UI) so every build path - CLI, dashboard, git - points at the live backend.
  VITE_API_BASE = "https://aura-backend-pg9r.onrender.com"

# Single-page app: every route serves index.html so refreshing works.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
