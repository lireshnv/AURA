# Render Blueprint - AURA backend on the free plan (512 MB RAM), using the
# lightweight dependency profile. Secrets marked sync:false are entered in the
# Render dashboard, never committed.
services:
  - type: web
    name: aura-backend
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements-lite.txt && pip install --no-deps -r requirements-face.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: AURA_ENV
        value: production
      - key: AURA_JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: AURA_CORS_ORIGINS
        sync: false
      - key: AURA_FRONTEND_URL
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
